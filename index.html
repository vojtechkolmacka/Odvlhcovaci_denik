<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koloběžníkův odvlhčovací deník</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <!-- Tailwind CSS & Chart.js & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gauge-container { position: relative; width: 160px; height: 80px; margin: 0 auto; overflow: hidden; }
        .gauge-semicircle { width: 160px; height: 80px; border-top-left-radius: 80px; border-top-right-radius: 80px; background: #334155; position: relative; overflow: hidden; }
        .gauge-needle { width: 4px; height: 70px; background: #0ea5e9; position: absolute; bottom: 0; left: 78px; transform-origin: bottom center; transition: transform 0.15s ease-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24">

    <!-- Horní lišta -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-cyan-500 text-slate-900 p-2 rounded-xl font-bold text-xl flex items-center justify-center w-10 h-10 shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-cyan-400 tracking-tight">Odvlhčovací deník</h1>
                    <p class="text-xs text-slate-400">Netatmo & ThermoPro systém</p>
                </div>
            </div>
            <button onclick="openRoomModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition shadow flex items-center space-x-1">
                <i class="fa-solid fa-plus"></i> <span>Nová místnost</span>
            </button>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Navigační záložky -->
        <div id="navTabsContainer" class="flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar border-b border-slate-800">
            <!-- Generováno dynamicky -->
        </div>

        <!-- Obsah záložek -->
        <div id="tabContentContainer">
            <!-- Generováno dynamicky -->
        </div>

    </main>

    <!-- MODÁLNÍ OKNO: PŘIDÁNÍ MÍSTNOSTI -->
    <div id="roomModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-lg text-slate-100">Přidat novou místnost</h3>
                <button onclick="closeModal('roomModal')" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="roomForm" onsubmit="saveRoom(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">Název místnosti *</label>
                    <input type="text" id="rName" required placeholder="např. Ložnice" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">Počáteční voda v litrech</label>
                    <input type="number" step="0.01" id="rInitialWater" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-700">
                    <button type="button" onclick="closeModal('roomModal')" class="bg-slate-700 text-white px-4 py-2 rounded-xl text-sm">Zrušit</button>
                    <button type="submit" class="bg-cyan-600 text-white px-5 py-2 rounded-xl text-sm font-semibold">Uložit místnost</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        const DB_NAME = 'KolobeznikOdvlhcovaniDB_V15';
        const DB_VERSION = 1;
        let db = null;
        let activeTab = 'room-1';
        let currentElectricityPrice = 6.0;

        const defaultRooms = [
            { id: 'room-1', name: 'Koloběžníkův pokoj', initialWater: 34.76, order: 1, color: '#0ea5e9' },
            { id: 'room-2', name: 'Valašský pokoj', initialWater: 9.70, order: 2, color: '#10b981' },
            { id: 'room-3', name: 'Zelený pokoj', initialWater: 2.50, order: 3, color: '#f59e0b' }
        ];

        const defaultMeasurements = [
            { roomId: 'room-1', timestamp: new Date(Date.now() - 3600000*2).toISOString(), humidity: 63, temperature: 21.0, deviceState: 'zapnutý', waterAdded: 0, note: 'Netatmo start' },
            { roomId: 'room-1', timestamp: new Date().toISOString(), humidity: 55, temperature: 21.0, deviceState: 'vypnutý', waterAdded: 0, note: 'Netatmo konec' },
            { roomId: 'room-2', timestamp: new Date().toISOString(), humidity: 50, temperature: 20.0, deviceState: 'zapnutý', waterAdded: 0, note: 'ThermoPro běží' },
            { roomId: 'room-3', timestamp: new Date().toISOString(), humidity: 41, temperature: 20.0, deviceState: 'zapnutý', waterAdded: 0, note: 'ThermoPro běží' }
        ];

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = async () => { 
                    db = request.result; 
                    await restoreFromLocalStorageBackup();
                    resolve(db); 
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains('rooms')) {
                        const rStore = database.createObjectStore('rooms', { keyPath: 'id' });
                        defaultRooms.forEach(r => rStore.add(r));
                    }
                    if (!database.objectStoreNames.contains('measurements')) {
                        const mStore = database.createObjectStore('measurements', { keyPath: 'id', autoIncrement: true });
                        defaultMeasurements.forEach(m => mStore.add(m));
                    }
                };
            });
        }

        function getAll(storeName) {
            return new Promise((resolve) => {
                if (!db) return resolve([]);
                const transaction = db.transaction(storeName, 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => resolve([]);
            });
        }

        function put(storeName, item) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(storeName, 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(item);
                request.onsuccess = async () => {
                    await createLocalStorageBackup();
                    resolve(request.result);
                };
                request.onerror = () => reject(request.error);
            });
        }

        async function createLocalStorageBackup() {
            if (!db) return;
            const rooms = await getAll('rooms');
            const measurements = await getAll('measurements');
            localStorage.setItem('kolobeznik_backup_safe', JSON.stringify({ rooms, measurements }));
        }

        async function restoreFromLocalStorageBackup() {
            const saved = localStorage.getItem('kolobeznik_backup_safe');
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                const rooms = await getAll('rooms');
                if (rooms.length === 0 && data.rooms) {
                    for (let r of data.rooms) await put('rooms', r);
                    for (let m of data.measurements) await put('measurements', m);
                }
            } catch (e) { console.error(e); }
        }

        function openRoomModal() { document.getElementById('roomModal').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function switchTab(tabId) { activeTab = tabId; renderApp(); }

        async function moveRoomOrder(roomId, direction) {
            const rooms = await getAll('rooms');
            rooms.sort((a, b) => (a.order || 0) - (b.order || 0));
            const idx = rooms.findIndex(r => r.id === roomId);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= rooms.length) return;
            const tempOrder = rooms[idx].order || idx;
            rooms[idx].order = rooms[targetIdx].order || targetIdx;
            rooms[targetIdx].order = tempOrder;
            await put('rooms', rooms[idx]);
            await put('rooms', rooms[targetIdx]);
            renderApp();
        }

        async function saveRoom(e) {
            e.preventDefault();
            const rooms = await getAll('rooms');
            const name = document.getElementById('rName').value;
            const initialWater = parseFloat(document.getElementById('rInitialWater').value) || 0;
            const newId = 'room-' + Date.now();
            const colors = ['#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#3b82f6'];
            const color = colors[rooms.length % colors.length];
            await put('rooms', { id: newId, name, initialWater, order: rooms.length + 1, color });
            closeModal('roomModal');
            activeTab = newId;
            renderApp();
        }

        // PŘIPOJENÍ THERMOPRO PŘES BLUETOOTH
        async function connectThermoPro(roomId) {
            try {
                if (!navigator.bluetooth) {
                    alert('Váš prohlížeč nepodporuje Web Bluetooth.');
                    return;
                }
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['environmental_sensing', '0000ffe0-0000-1000-8000-00805f9b34fb']
                });
                
                const server = await device.gatt.connect();
                let temp = 21.0, hum = 55;
                try {
                    const service = await server.getPrimaryService('environmental_sensing');
                    try {
                        const tempVal = await (await service.getCharacteristic('temperature')).readValue();
                        temp = tempVal.getInt16(0, true) / 100.0;
                    } catch(e) {}
                    try {
                        const humVal = await (await service.getCharacteristic('humidity')).readValue();
                        hum = humVal.getUint16(0, true) / 100.0;
                    } catch(e) {}
                } catch(e) {
                    alert('Zařízení je připojené, ale služba nebyla plně detekována.');
                }

                const measurements = await getAll('measurements');
                const rMeas = measurements.filter(m => m.roomId === roomId).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                const last = rMeas[0] || { deviceState: 'vypnutý' };

                await put('measurements', {
                    roomId: roomId,
                    timestamp: new Date().toISOString(),
                    humidity: Math.round(hum),
                    temperature: parseFloat(temp.toFixed(1)),
                    deviceState: last.deviceState,
                    waterAdded: 0,
                    note: `ThermoPro (${device.name || 'Čidlo'})`
                });
                renderApp();
                alert(`Úspěšně načteno: ${temp.toFixed(1)}°C, ${Math.round(hum)}%`);
            } catch (err) {
                alert('Chyba připojení ThermoPro: ' + err.message);
            }
        }

        // NETATMO: OTEVŘENÍ AUTORIZACE V PROHLÍŽEČI
        function startNetatmoAuth() {
            const clientId = document.getElementById('netatmoClientId').value;
            if (!clientId) {
                alert('Nejprve vyplňte Client ID!');
                return;
            }
            const authUrl = `https://api.netatmo.com/oauth2/authorize?client_id=${clientId}&redirect_uri=https://localhost&scope=read_station`;
            window.location.href = authUrl;
        }

        // NETATMO: VÝMĚNA URL ADRESY ZA REFRESH TOKEN
        async function exchangeNetatmoCode() {
            const clientId = document.getElementById('netatmoClientId').value;
            const clientSecret = document.getElementById('netatmoClientSecret').value;
            const fullUrlInput = document.getElementById('netatmoFullUrl').value;

            if (!clientId || !clientSecret || !fullUrlInput) {
                alert('Vyplňte Client ID, Client Secret a zkopírujte celou URL adresu!');
                return;
            }

            let code = '';
            try {
                const urlObj = new URL(fullUrlInput);
                code = urlObj.searchParams.get('code');
            } catch(e) {
                code = fullUrlInput.trim();
            }

            if (!code) {
                alert('Nepodařilo se najít kód v URL adrese!');
                return;
            }

            try {
                const tokenRes = await fetch('https://api.netatmo.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        client_id: clientId,
                        client_secret: clientSecret,
                        code: code,
                        redirect_uri: 'https://localhost',
                        scope: 'read_station'
                    })
                });
                const tokenData = await tokenRes.json();
                if (tokenData.refresh_token) {
                    localStorage.setItem('netatmo_client_id', clientId);
                    localStorage.setItem('netatmo_client_secret', clientSecret);
                    localStorage.setItem('netatmo_refresh_token', tokenData.refresh_token);
                    document.getElementById('netatmoRefreshToken').value = tokenData.refresh_token;
                    alert('Úspěšně získán a uložen Refresh Token!');
                } else {
                    throw new Error(tokenData.error || 'Neznámá chyba tokenu.');
                }
            } catch(err) {
                alert('Chyba při výměně kódu: ' + err.message);
            }
        }

        // NETATMO: STAŽENÍ DAT PRO KOLOBĚŽNÍKŮV POKOJ
        async function syncNetatmoForRoom(roomId) {
            const clientId = localStorage.getItem('netatmo_client_id') || document.getElementById('netatmoClientId').value;
            const clientSecret = localStorage.getItem('netatmo_client_secret') || document.getElementById('netatmoClientSecret').value;
            const refreshToken = localStorage.getItem('netatmo_refresh_token') || document.getElementById('netatmoRefreshToken').value;

            if (!clientId || !clientSecret || !refreshToken) {
                alert('Nejprve nastavte Netatmo API v záložce "Záloha & API"!');
                switchTab('backup');
                return;
            }

            try {
                const tokenRes = await fetch('https://api.netatmo.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refreshToken, client_id: clientId, client_secret: clientSecret })
                });
                const tokenData = await tokenRes.json();
                if (!tokenData.access_token) throw new Error('Obnovení tokenu selhalo.');

                const dataRes = await fetch('https://api.netatmo.com/api/getstationsdata', {
                    headers: { 'Authorization': `Bearer ${tokenData.access_token}` }
                });
                const jsonData = await dataRes.json();
                
                const module = jsonData.body.devices[0].dashboard_data;
                const temp = module.Temperature;
                const hum = module.Humidity;

                const measurements = await getAll('measurements');
                const rMeas = measurements.filter(m => m.roomId === roomId).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                const last = rMeas[0] || { deviceState: 'vypnutý' };

                await put('measurements', {
                    roomId: roomId,
                    timestamp: new Date().toISOString(),
                    humidity: hum,
                    temperature: temp,
                    deviceState: last.deviceState,
                    waterAdded: 0,
                    note: 'Netatmo meteostation'
                });
                renderApp();
                alert(`Netatmo data stažena: ${temp}°C, ${hum}%`);
            } catch (err) {
                alert('Chyba stahování z Netatmo: ' + err.message);
            }
        }

        function saveNetatmoConfig() {
            localStorage.setItem('netatmo_client_id', document.getElementById('netatmoClientId').value);
            localStorage.setItem('netatmo_client_secret', document.getElementById('netatmoClientSecret').value);
            localStorage.setItem('netatmo_refresh_token', document.getElementById('netatmoRefreshToken').value);
            alert('Netatmo údaje uloženy!');
        }

        function calculateRoomEnergy(rMeasurements) {
            rMeasurements.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
            let totalHours = 0, lastOnTime = null;
            rMeasurements.forEach(m => {
                if (m.deviceState === 'zapnutý') {
                    if (!lastOnTime) lastOnTime = new Date(m.timestamp);
                } else if (m.deviceState === 'vypnutý') {
                    if (lastOnTime) {
                        totalHours += (new Date(m.timestamp) - lastOnTime) / (1000 * 60 * 60);
                        lastOnTime = null;
                    }
                }
            });
            if (lastOnTime) totalHours += (new Date() - lastOnTime) / (1000 * 60 * 60);
            const totalKWh = totalHours * (300 / 1000);
            return { hours: totalHours.toFixed(1), kWh: totalKWh.toFixed(2), price: (totalKWh * currentElectricityPrice).toFixed(1) };
        }

        async function renderApp() {
            const rooms = await getAll('rooms');
            rooms.sort((a, b) => (a.order || 0) - (b.order || 0));
            const measurements = await getAll('measurements');

            if (!rooms.some(r => r.id === activeTab) && !['stats', 'backup'].includes(activeTab)) {
                activeTab = rooms.length > 0 ? rooms[0].id : 'stats';
            }

            const tabsContainer = document.getElementById('navTabsContainer');
            let tabsHTML = rooms.map((r, idx) => {
                const rMeas = measurements.filter(m => m.roomId === r.id).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                const isRunning = rMeas[0] && rMeas[0].deviceState === 'zapnutý';
                const dotColor = isRunning ? 'bg-emerald-400 shadow-[0_0_8px_#34d399]' : 'bg-red-500';

                return `
                    <div class="flex items-center bg-slate-800/90 rounded-xl border ${activeTab === r.id ? 'border-cyan-500 bg-cyan-500/15' : 'border-slate-700'} shrink-0 overflow-hidden shadow-sm">
                        <button onclick="switchTab('${r.id}')" class="px-3 py-2 font-semibold text-xs whitespace-nowrap transition ${activeTab === r.id ? 'text-cyan-400' : 'text-slate-300'} flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full ${dotColor}"></span>
                            <span>${r.name}</span>
                        </button>
                        <div class="flex flex-col border-l border-slate-700/80 text-[9px] bg-slate-900/40">
                            <button onclick="moveRoomOrder('${r.id}', -1)" ${idx === 0 ? 'disabled class="opacity-20 cursor-not-allowed"' : ''} class="px-1.5 py-0.5 hover:bg-slate-700 text-slate-400"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="moveRoomOrder('${r.id}', 1)" ${idx === rooms.length - 1 ? 'disabled class="opacity-20 cursor-not-allowed"' : ''} class="px-1.5 py-0.5 hover:bg-slate-700 text-slate-400"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            tabsHTML += `
                <button onclick="switchTab('stats')" class="px-3.5 py-2 rounded-xl font-semibold text-xs whitespace-nowrap shrink-0 transition ${activeTab === 'stats' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50' : 'bg-slate-800 text-slate-300 border border-slate-700'}">
                    <i class="fa-solid fa-chart-line mr-1"></i> Statistiky & Grafy
                </button>
                <button onclick="switchTab('backup')" class="px-3.5 py-2 rounded-xl font-semibold text-xs whitespace-nowrap shrink-0 transition ${activeTab === 'backup' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50' : 'bg-slate-800 text-slate-300 border border-slate-700'}">
                    <i class="fa-solid fa-database mr-1"></i> Záloha & API
                </button>
            `;
            tabsContainer.innerHTML = tabsHTML;

            const contentContainer = document.getElementById('tabContentContainer');

            if (activeTab === 'stats') {
                let totalWater = rooms.reduce((sum, r) => sum + (r.initialWater || 0), 0);
                measurements.forEach(m => totalWater += (m.waterAdded || 0));
                let houseTotalKWh = 0, houseTotalPrice = 0;
                rooms.forEach(r => {
                    const stats = calculateRoomEnergy(measurements.filter(m => m.roomId === r.id));
                    houseTotalKWh += parseFloat(stats.kWh);
                    houseTotalPrice += parseFloat(stats.price);
                });

                contentContainer.innerHTML = `
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-3xl shadow-xl">
                                <span class="text-xs font-semibold text-slate-400 uppercase">Voda v celém domě</span>
                                <div class="text-3xl font-bold text-cyan-400 mt-1">${totalWater.toFixed(2)} l</div>
                            </div>
                            <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-3xl shadow-xl">
                                <span class="text-xs font-semibold text-slate-400 uppercase">Hromadná spotřeba</span>
                                <div class="text-3xl font-bold text-amber-400 mt-1">${houseTotalKWh.toFixed(2)} kWh</div>
                            </div>
                            <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-3xl shadow-xl">
                                <span class="text-xs font-semibold text-slate-400 uppercase">Celková cena za energii</span>
                                <div class="text-3xl font-bold text-emerald-400 mt-1">${Math.round(houseTotalPrice)} Kč</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-3xl space-y-3">
                                <h3 class="font-semibold text-slate-200 text-sm"><i class="fa-solid fa-droplet text-cyan-400 mr-1"></i> Srovnání vlhkosti (%)</h3>
                                <div class="h-64 relative"><canvas id="globalHumChart"></canvas></div>
                            </div>
                            <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-3xl space-y-3">
                                <h3 class="font-semibold text-slate-200 text-sm"><i class="fa-solid fa-water text-blue-400 mr-1"></i> Srovnání vody (l)</h3>
                                <div class="h-64 relative"><canvas id="globalWaterChart"></canvas></div>
                            </div>
                            <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-3xl space-y-3">
                                <h3 class="font-semibold text-slate-200 text-sm"><i class="fa-solid fa-bolt text-amber-400 mr-1"></i> Srovnání spotřeby (kWh)</h3>
                                <div class="h-64 relative"><canvas id="globalPowerChart"></canvas></div>
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => renderGlobalCharts(rooms, measurements), 50);

            } else if (activeTab === 'backup') {
                contentContainer.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-slate-800 border border-slate-700/80 p-6 rounded-3xl shadow-xl space-y-6">
                            <h2 class="text-xl font-bold text-cyan-400 flex items-center"><i class="fa-solid fa-database mr-2"></i> Záloha a obnova dat</h2>
                            <div class="flex flex-wrap gap-4 pt-2">
                                <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow flex items-center space-x-2">
                                    <i class="fa-solid fa-download"></i> <span>Stáhnout zálohu (JSON)</span>
                                </button>
                                <label class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow flex items-center space-x-2 cursor-pointer">
                                    <i class="fa-solid fa-upload"></i> <span>Obnovit ze zálohy</span>
                                    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" class="hidden">
                                </label>
                            </div>
                        </div>

                        <!-- NETATMO API NASTAVENÍ S AUTOMATICKÝM TLAČÍTKEM -->
                        <div class="bg-slate-800 border border-slate-700/80 p-6 rounded-3xl shadow-xl space-y-4">
                            <h2 class="text-xl font-bold text-cyan-400 flex items-center"><i class="fa-solid fa-cloud mr-2"></i> Nastavení Netatmo API</h2>
                            <p class="text-xs text-slate-300">Zadejte své údaje a vygenerujte Refresh Token přímo v aplikaci.</p>
                            <div class="space-y-3">
                                <input type="text" id="netatmoClientId" value="${localStorage.getItem('netatmo_client_id') || ''}" placeholder="Netatmo Client ID" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100">
                                <input type="password" id="netatmoClientSecret" value="${localStorage.getItem('netatmo_client_secret') || ''}" placeholder="Netatmo Client Secret" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100">
                                
                                <button onclick="startNetatmoAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow">
                                    1. Získat autorizační kód (Přihlásit k Netatmo)
                                </button>

                                <input type="text" id="netatmoFullUrl" placeholder="Sem vlož zkopírovanou URL adresu z prohlížeče (https://localhost/?code=...)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100">
                                
                                <button onclick="exchangeNetatmoCode()" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow">
                                    2. Vyměnit kód za Refresh Token
                                </button>

                                <input type="text" id="netatmoRefreshToken" value="${localStorage.getItem('netatmo_refresh_token') || ''}" placeholder="Refresh Token (vyplní se sám)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100">
                                
                                <button onclick="saveNetatmoConfig()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow">
                                    Uložit nastavení Netatmo
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const r = rooms.find(room => room.id === activeTab);
                if (!r) return;

                const rMeas = measurements.filter(m => m.roomId === r.id).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                const latest = rMeas[0] || { humidity: 55, temperature: 21, deviceState: 'vypnutý' };
                const totalWater = (r.initialWater || 0) + rMeas.reduce((sum, m) => sum + (m.waterAdded || 0), 0);
                const isRunning = latest.deviceState === 'zapnutý';
                const energyStats = calculateRoomEnergy(rMeas);

                const tempAngle = Math.min(Math.max((latest.temperature / 40) * 180 - 90, -90), 90);
                const humAngle = Math.min(Math.max(((latest.humidity - 20) / 70) * 180 - 90, -90), 90);

                let sensorButtonHTML = '';
                if (r.id === 'room-1') {
                    sensorButtonHTML = `<button onclick="syncNetatmoForRoom('${r.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-semibold transition shadow flex items-center space-x-1.5"><i class="fa-solid fa-cloud-arrow-down"></i> <span>Načíst Netatmo</span></button>`;
                } else {
                    sensorButtonHTML = `<button onclick="connectThermoPro('${r.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-semibold transition shadow flex items-center space-x-1.5"><i class="fa-brands fa-bluetooth-b"></i> <span>Připojit ThermoPro</span></button>`;
                }

                contentContainer.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-3xl shadow-xl space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-700 pb-4">
                            <div>
                                <h2 class="text-xl font-bold flex items-center" style="color: ${r.color}">
                                    <i class="fa-solid fa-house-chimney mr-2"></i> ${r.name}
                                </h2>
                                <p class="text-xs text-slate-400">Poslední akce: ${new Date(latest.timestamp).toLocaleString('cs-CZ')}</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                                ${sensorButtonHTML}
                                <div class="flex items-center space-x-1.5 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                                    <span class="text-slate-400">Cena kWh:</span>
                                    <input type="number" step="0.5" value="${currentElectricityPrice}" onchange="currentElectricityPrice = parseFloat(this.value) || 6.0; renderApp();" class="w-14 bg-slate-800 text-cyan-400 font-bold text-center rounded p-0.5">
                                    <span class="text-slate-400">Kč</span>
                                </div>
                                <button onclick="setDeviceState('${r.id}', 'zapnutý')" class="px-4 py-2 rounded-xl font-bold text-xs transition ${isRunning ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/30' : 'bg-slate-900 text-slate-400 border border-slate-700'}">
                                    <i class="fa-solid fa-play mr-1"></i> ZAPNUTO
                                </button>
                                <button onclick="setDeviceState('${r.id}', 'vypnutý')" class="px-4 py-2 rounded-xl font-bold text-xs transition ${!isRunning ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-slate-900 text-slate-400 border border-slate-700'}">
                                    <i class="fa-solid fa-stop mr-1"></i> VYPNUTO
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50">
                            <div>
                                <span class="text-[11px] uppercase font-semibold text-slate-400">Běžící čas</span>
                                <div class="text-lg font-bold text-slate-100 mt-0.5">${energyStats.hours} hod</div>
                            </div>
                            <div>
                                <span class="text-[11px] uppercase font-semibold text-slate-400">Spotřeba energie</span>
                                <div class="text-lg font-bold text-amber-400 mt-0.5">${energyStats.kWh} kWh</div>
                            </div>
                            <div>
                                <span class="text-[11px] uppercase font-semibold text-slate-400">Cena za provoz</span>
                                <div class="text-lg font-bold text-emerald-400 mt-0.5">${energyStats.price} Kč</div>
                            </div>
                            <div>
                                <span class="text-[11px] uppercase font-semibold text-slate-400">Zachycená voda</span>
                                <div class="text-lg font-bold text-cyan-400 mt-0.5">${totalWater.toFixed(2)} l</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-slate-900/70 border border-slate-700/60 p-4 rounded-2xl space-y-3 text-center">
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block"><i class="fa-solid fa-temperature-three-quarters text-emerald-400 mr-1"></i> Teplota (Budík)</span>
                                <div class="gauge-container">
                                    <div class="gauge-semicircle">
                                        <div class="gauge-needle" id="needle-temp-${r.id}" style="transform: rotate(${tempAngle}deg);"></div>
                                    </div>
                                </div>
                                <div class="text-xl font-bold text-emerald-400">${latest.temperature} °C</div>
                                <div class="space-y-2">
                                    <input type="range" min="0" max="40" step="0.5" value="${latest.temperature}" 
                                        oninput="moveNeedle('${r.id}', 'temp', this.value); this.nextElementSibling.value = this.value;" 
                                        onchange="updateMetric('${r.id}', 'temperature', this.value)" class="w-full">
                                    <div class="flex justify-center items-center space-x-2">
                                        <input type="number" step="0.5" value="${latest.temperature}" id="input-temp-${r.id}" class="w-24 bg-slate-800 border border-slate-700 text-center text-sm rounded-lg p-1 text-slate-100">
                                        <button onclick="updateMetric('${r.id}', 'temperature', document.getElementById('input-temp-${r.id}').value)" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1.5 rounded-lg">Zapsat</button>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-slate-900/70 border border-slate-700/60 p-4 rounded-2xl space-y-3 text-center">
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block"><i class="fa-solid fa-droplet text-cyan-400 mr-1"></i> Vlhkost (Budík)</span>
                                <div class="gauge-container">
                                    <div class="gauge-semicircle">
                                        <div class="gauge-needle" id="needle-hum-${r.id}" style="transform: rotate(${humAngle}deg);"></div>
                                    </div>
                                </div>
                                <div class="text-xl font-bold text-cyan-400">${latest.humidity} %</div>
                                <div class="space-y-2">
                                    <input type="range" min="20" max="90" step="1" value="${latest.humidity}" 
                                        oninput="moveNeedle('${r.id}', 'hum', this.value); this.nextElementSibling.value = this.value;" 
                                        onchange="updateMetric('${r.id}', 'humidity', this.value)" class="w-full">
                                    <div class="flex justify-center items-center space-x-2">
                                        <input type="number" step="1" value="${latest.humidity}" id="input-hum-${r.id}" class="w-24 bg-slate-800 border border-slate-700 text-center text-sm rounded-lg p-1 text-slate-100">
                                        <button onclick="updateMetric('${r.id}', 'humidity', document.getElementById('input-hum-${r.id}').value)" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1.5 rounded-lg">Zapsat</button>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-slate-900/70 border border-slate-700/60 p-4 rounded-2xl space-y-3 flex flex-col justify-between">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-water text-blue-400 mr-1"></i> Zachycená voda</span>
                                    <span class="text-xl font-bold text-blue-400">${totalWater.toFixed(2)} l</span>
                                </div>
                                <div class="pt-2 border-t border-slate-800">
                                    <label class="block text-[11px] text-slate-400 mb-1">Přidat vodu z Comfee (roletka):</label>
                                    <select onchange="addWater('${r.id}', this.value); this.value='';" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-cyan-500">
                                        <option value="">-- Vyber objem vody --</option>
                                        <option value="0.25">0.25 l</option>
                                        <option value="0.5">0.5 l</option>
                                        <option value="1.0">1.0 l</option>
                                        <option value="1.25">1.25 l (Půl nádrže)</option>
                                        <option value="2.5">2.5 l (Plná nádrž)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="bg-slate-900/70 border border-slate-700/60 p-4 rounded-2xl flex flex-col justify-between">
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-chart-line text-amber-400 mr-1"></i> Vývoj vlhkosti</span>
                                <div class="h-28 relative">
                                    <canvas id="chart-${r.id}"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => renderRoomChart(r.id, rMeas, r.color), 50);
            }
        }

        function moveNeedle(roomId, type, val) {
            const needle = document.getElementById(`needle-${type}-${roomId}`);
            if (!needle) return;
            let angle = type === 'temp' ? (parseFloat(val) / 40) * 180 - 90 : ((parseFloat(val) - 20) / 70) * 180 - 90;
            needle.style.transform = `rotate(${Math.min(Math.max(angle, -90), 90)}deg)`;
        }

        async function setDeviceState(roomId, state) {
            const measurements = await getAll('measurements');
            const rMeas = measurements.filter(m => m.roomId === roomId).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            const last = rMeas[0] || { humidity: 55, temperature: 21 };
            await put('measurements', {
                roomId: roomId,
                timestamp: new Date().toISOString(),
                humidity: last.humidity,
                temperature: last.temperature,
                deviceState: state,
                waterAdded: 0,
                note: `Přepnuto na: ${state}`
            });
            renderApp();
        }

        async function updateMetric(roomId, field, value) {
            if (value === '' || isNaN(value)) return;
            const measurements = await getAll('measurements');
            const rMeas = measurements.filter(m => m.roomId === roomId).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            const last = rMeas[0] || { deviceState: 'vypnutý', humidity: 55, temperature: 21 };
            await put('measurements', {
                roomId: roomId,
                timestamp: new Date().toISOString(),
                humidity: field === 'humidity' ? parseFloat(value) : last.humidity,
                temperature: field === 'temperature' ? parseFloat(value) : last.temperature,
                deviceState: last.deviceState,
                waterAdded: 0,
                note: `Změna ${field}`
            });
            renderApp();
        }

        async function addWater(roomId, amountStr) {
            if (!amountStr) return;
            const amount = parseFloat(amountStr);
            const measurements = await getAll('measurements');
            const rMeas = measurements.filter(m => m.roomId === roomId).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            const last = rMeas[0] || { deviceState: 'vypnutý', humidity: 55, temperature: 21 };
            await put('measurements', {
                roomId: roomId,
                timestamp: new Date().toISOString(),
                humidity: last.humidity,
                temperature: last.temperature,
                deviceState: last.deviceState,
                waterAdded: amount,
                note: `Přidáno ${amount} l`
            });
            renderApp();
        }

        function renderRoomChart(roomId, rMeasurements, color) {
            const canvas = document.getElementById(`chart-${roomId}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            rMeasurements.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: rMeasurements.map(m => new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
                    datasets: [{ data: rMeasurements.map(m => m.humidity), borderColor: color, backgroundColor: color + '22', fill: true, tension: 0.3, pointRadius: 2 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#334155' }, min: 20, max: 90 } }
                }
            });
        }

        function renderGlobalCharts(rooms, measurements) {
            const labels = [...new Set(measurements.map(m => new Date(m.timestamp).toLocaleDateString()))].slice(-7);

            const humCtx = document.getElementById('globalHumChart').getContext('2d');
            new Chart(humCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: rooms.map(r => ({
                        label: r.name,
                        data: labels.map(date => {
                            const found = measurements.filter(m => m.roomId === r.id && new Date(m.timestamp).toLocaleDateString() === date);
                            return found.length > 0 ? found[found.length - 1].humidity : null;
                        }),
                        borderColor: r.color,
                        tension: 0.3,
                        spanGaps: true
                    }))
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#cbd5e1', boxWidth: 12 } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' }, min: 20, max: 90 } } }
            });

            const waterCtx = document.getElementById('globalWaterChart').getContext('2d');
            new Chart(waterCtx, {
                type: 'bar',
                data: {
                    labels: rooms.map(r => r.name),
                    datasets: [{
                        label: 'Zachycená voda (l)',
                        data: rooms.map(r => (r.initialWater || 0) + measurements.filter(m => m.roomId === r.id).reduce((s, m) => s + (m.waterAdded || 0), 0)),
                        backgroundColor: rooms.map(r => r.color)
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
            });

            const powerCtx = document.getElementById('globalPowerChart').getContext('2d');
            new Chart(powerCtx, {
                type: 'bar',
                data: {
                    labels: rooms.map(r => r.name),
                    datasets: [{
                        label: 'Spotřeba (kWh)',
                        data: rooms.map(r => parseFloat(calculateRoomEnergy(measurements.filter(m => m.roomId === r.id)).kWh)),
                        backgroundColor: rooms.map(r => r.color)
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
            });
        }

        async function exportJSON() {
            const rooms = await getAll('rooms');
            const measurements = await getAll('measurements');
            const blob = new Blob([JSON.stringify({ rooms, measurements }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'kolobeznik_zaloha.json';
            a.click();
        }

        async function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const data = JSON.parse(e.target.result);
                if (data.rooms) for (let r of data.rooms) await put('rooms', r);
                if (data.measurements) for (let m of data.measurements) await put('measurements', m);
                alert('Záloha úspěšně obnovena!');
                renderApp();
            };
            reader.readAsText(file);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            renderApp();
        });
    </script>
</body>
</html>
